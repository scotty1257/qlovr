[package]
name = "fastlogviewer-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Memory-mapped log indexing, search and Drain-style template clustering."

[dependencies]
memmap2 = "0.9"
fancy-regex = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
uuid = { version = "1", features = ["v4", "serde"] }
