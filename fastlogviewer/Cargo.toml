[package]
name = "fastlogviewer"
version.workspace = true
edition.workspace = true
# iced 0.14 needs 1.88; the core crate keeps the workspace minimum.
rust-version = "1.88"

[dependencies]
fastlogviewer-core = { path = "../fastlogviewer-core" }
iced = { version = "0.14.0", features = [
  "canvas",
  "tokio",
  "svg",
  "web-colors",
  "wgpu",
  "webgl",
] }
rfd = "0.17.2"
uuid = { version = "1.26.1", features = ["v4"] }
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }
